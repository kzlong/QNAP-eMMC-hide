<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QNAP eMMC 隐藏</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#10141c;color:#e7edf6}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1050px;margin:auto}.top{display:flex;align-items:center;gap:14px;margin-bottom:20px}.logo{width:54px;height:54px;border-radius:15px;background:#1d3344;display:grid;place-items:center;font-size:27px}.muted{color:#98a8bc;font-size:13px}.card{background:#171e29;border:1px solid #2b3545;border-radius:14px;padding:18px;margin:14px 0}.status{display:flex;align-items:center;gap:9px;font-weight:650}.dot{width:9px;height:9px;border-radius:50%;background:#68758a}.dot.ok{background:#48d597}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}button{background:#27374a;color:#f2f6fb;border:1px solid #43556c;border-radius:9px;padding:10px 15px;cursor:pointer;font-size:14px}button.primary{background:#146b56;border-color:#23896f}button.danger{background:#512b32;border-color:#82424b}button:disabled{opacity:.55;cursor:wait}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid #2b3545}.table th{color:#9fb0c5;font-weight:500}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#253c35;color:#8ee2bc;font-size:12px}.pill.warn{background:#47352b;color:#f4c58a}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1017;padding:12px;border-radius:9px;max-height:330px;overflow:auto;font-size:12px;line-height:1.55;color:#c6d3e3}.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}@media(max-width:600px){body{padding:14px}.table{font-size:12px}.table th,.table td{padding:8px 4px}}
</style></head><body><header class="top"><div class="logo">▣</div><div><h1>QNAP eMMC 隐藏</h1><div class="muted">自动隐藏 fnOS 文件管理器中的 QNAP 原厂 eMMC 分区</div></div></header>
<section class="card"><div class="headrow"><div><div class="status"><span id="dot" class="dot"></span><span id="state">正在读取服务状态…</span></div><div id="statusText" class="muted" style="margin-top:6px">开机后由应用服务启动；仅处理指定 eMMC 分区。</div></div><button onclick="refreshAll()">刷新状态</button></div><div class="actions"><button class="primary" onclick="action('/api/start')">启动隐藏服务</button><button class="danger" onclick="action('/api/stop')">停止隐藏服务</button><button onclick="action('/api/hide-now')">立即隐藏一次</button></div></section>
<section class="card"><h2>eMMC 分区状态</h2><div class="muted" style="margin-bottom:10px">只检查 /dev/mmcblk0p1、p2、p3、p5、p6、p7；不会修改分区或数据。</div><table class="table"><thead><tr><th>设备</th><th>挂载位置</th><th>状态</th></tr></thead><tbody id="parts"><tr><td colspan="3">读取中…</td></tr></tbody></table></section>
<section class="card"><div class="headrow"><h2>运行日志</h2><button onclick="loadLogs()">刷新日志</button></div><div id="logPath" class="muted" style="margin-bottom:8px"></div><pre id="logs">正在读取日志…</pre></section><div class="muted">提示：停止服务后，若 fnOS 再次挂载这些分区，它们可能重新显示。日志仅保留最近 150 行用于界面查看。</div>
<script>
async function get(url,opt){const r=await fetch(url,opt||{cache:'no-store'});let d=await r.json();if(!r.ok)throw Error(d.message||r.statusText);return d}
async function refreshStatus(){try{const d=await get('/api/status');document.getElementById('dot').className='dot '+(d.running?'ok':'');document.getElementById('state').textContent=d.running?'隐藏服务运行中':'隐藏服务已停止';document.getElementById('statusText').textContent='服务状态：'+d.service_status;document.getElementById('parts').innerHTML=d.partitions.map(p=>`<tr><td>${p.device}</td><td>${p.mounted_targets.length?p.mounted_targets.join('<br>'):'—'}</td><td><span class="pill ${p.hidden?'':'warn'}">${p.hidden?'已隐藏 / 未挂载':'仍有挂载'}</span></td></tr>`).join('')}catch(e){document.getElementById('state').textContent='读取状态失败';document.getElementById('statusText').textContent=e.message}}
async function loadLogs(){try{const d=await get('/api/logs');document.getElementById('logPath').textContent='日志路径：'+d.path;document.getElementById('logs').textContent=d.lines||'暂无日志'}catch(e){document.getElementById('logs').textContent='读取日志失败：'+e.message}}
async function action(path){const btns=[...document.querySelectorAll('button')];btns.forEach(b=>b.disabled=true);try{const d=await get(path,{method:'POST'});alert(d.message||'操作已完成')}catch(e){alert('操作失败：'+e.message)}finally{btns.forEach(b=>b.disabled=false);await refreshAll()}}
async function refreshAll(){await refreshStatus();await loadLogs()}refreshAll();setInterval(refreshStatus,10000);setInterval(loadLogs,20000);
</script></body></html>
